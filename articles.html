// Group by category
const categories = ['刑事辩护','民商事诉讼','公司股权','建设工程','海事海商','数据合规'];
const catIcons = {刑事辩护:'⚖️',民商事诉讼:'📄',公司股权:'🏢',建设工程:'🏗️',海事海商:'🚢',数据合规:'📊'};

function renderArticles(filter) {
  const q = (filter || '').toLowerCase().trim();
  let html = '';
  let totalVisible = 0;

  for (const cat of categories) {
    const catArticles = articles.filter(a => {
      if (a.cat !== cat) return false;
      if (!q) return true;
      return a.title.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q) || a.cat.includes(q);
    });

    if (catArticles.length === 0) continue;
    totalVisible += catArticles.length;

    html += `<div class="cat-section">`;
    html += `<div class="cat-title"><span class="cat-icon">${catIcons[cat]}</span>${cat}<span class="cat-count">（${catArticles.length}篇）</span></div>`;
    html += `<div class="article-list">`;
    for (const a of catArticles) {
      html += `<a href="articles/${a.file}.html" class="article-link"><span class="al-title">${a.title}</span><span class="al-desc">— ${a.desc}</span></a>`;
    }
    html += `</div></div>`;
  }

  document.getElementById('articleList').innerHTML = html || '<div class="no-result">没有找到匹配的文章，试试其他关键词</div>';
  document.getElementById('searchInfo').textContent = q ? `找到 ${totalVisible} 篇相关文章` : `共 ${articles.length} 篇文章`;
}

function filterArticles() {
  renderArticles(document.getElementById('search').value);
}

// Initial render
renderArticles('');
